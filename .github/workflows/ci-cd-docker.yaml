name: Docker deploy on ec2

on: 
  push:
    branches:
       - main


jobs:
  build:
     name: Docker build and push
     runs-on: ubuntu-latest
     steps:
        - name: Git checkout
          uses: actions/checkout@v6
        - name: Setup python
          uses: actions/setup-python@v6
          with:
            python-version: '3.13'
        
        - name: Install requirements
          run: pip install -r requirements.txt

        - name: Run Pytests
          run: pytest tests\

        - name: Docker login
          uses: docker/login-action@v4
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Docker Build and Push
          uses: docker/build-push-action@v7
          with:
            push: true
            context: .
            tags: |
               ${{ secrets.DOCKER_USERNAME }}/gist-api:latest
               ${{ secrets.DOCKER_USERNAME }}/gist-api:${{ github.sha }}
       

  deploy:
     name: Deploy on EC2
     runs-on: ubuntu-latest
     needs: build
     
     steps:
        - name: SSH to EC2 and Deploy Docker container
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ubuntu
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
                docker pull ${{ secrets.DOCKER_USERNAME }}/gist-api:${{ github.sha }}
    
                docker run -d --name gist-api \
                      -p 8080:8080 \
                      ${{ secrets.DOCKER_USERNAME }}/gist-api:${{ github.sha }}
            
                  
        
     
      
       
    
